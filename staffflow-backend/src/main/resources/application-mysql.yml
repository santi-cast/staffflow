spring:
  datasource:
    # DB_URL es opcional (por defecto MySQL local). DB_USERNAME y DB_PASSWORD son
    # OBLIGATORIAS en este perfil y no tienen valor por defecto: si faltan, el arranque
    # falla al abrir la conexion (Access denied for user '${DB_USERNAME}'), que es el
    # comportamiento deseado. Nunca se distribuyen credenciales por defecto.
    # Las variables SPRING_DATASOURCE_* documentadas en docs/despliegue.md siguen
    # teniendo prioridad sobre este archivo (binding relajado de Spring Boot).
    url: ${DB_URL:jdbc:mysql://localhost:3306/staffflow?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true&sslMode=DISABLED}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Europe/Madrid
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

staffflow:
  mail:
    from: ${MAIL_USERNAME}
    reset-url: staffflow://reset-password?token=
  jwt:
    # JWT_SECRET es OBLIGATORIA en este perfil y no tiene valor por defecto: el arranque
    # falla si no esta definida (intencional). Nota: Spring no soporta la sintaxis
    # bash "${VAR:?mensaje}"; todo lo que sigue a ":" se toma como valor por defecto.
    secret: ${JWT_SECRET}
    # Validez del token en milisegundos. 43200000 = 12 horas.
    # 12h cubre una jornada laboral con descanso de comida.
    # Refresh token queda como mejora para v2.0.
    expiration-ms: 43200000
